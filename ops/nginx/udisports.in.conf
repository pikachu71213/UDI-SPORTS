server {
  listen 80;
  server_name udisports.in www.udisports.in;

  root /var/www/udisports/webfrontend/dist;
  index index.html;

  # Legacy URL canonicalization
  location = /Contribute-now {
    return 301 /donate-now;
  }

  # Static assets
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API reverse proxy
  location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback (must be after static and API locations)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
